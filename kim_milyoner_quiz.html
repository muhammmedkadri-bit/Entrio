<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kim Gerçekleri Bilmek İster?</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
        }

        .app-wrapper {
            position: relative; width: 100%; min-height: 100vh; min-height: -webkit-fill-available;
            background: radial-gradient(circle at center, #01183c, #000000);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow-y: auto; overflow-x: hidden; padding: 20px 0; box-sizing: border-box;
        }

        .ambient-light {
            position: absolute; width: 600px; height: 600px; border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 50, 150, 0.15) 0%, transparent 70%);
            z-index: 1; pointer-events: none;
        }
        .light-1 { top: -200px; left: -200px; }
        .light-2 { bottom: -200px; right: -200px; }

        .start-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; height: 100%; z-index: 50; padding: 20px; box-sizing: border-box; text-align: center;
        }

        .logo-circle {
            width: 320px; height: 320px; border-radius: 50%; border: 8px solid #d4af37;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle, #001233, #000511);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.6), inset 0 0 20px #000;
            margin-bottom: 40px; animation: floating 3s ease-in-out infinite; padding: 20px; text-align: center;
            box-sizing: border-box;
        }

        .logo-text { font-size: 2.2rem; color: #fff; font-weight: bold; text-shadow: 0 0 10px #fff; line-height: 1.2; text-transform: uppercase;}
        .logo-sub { font-size: 1.3rem; color: #d4af37; margin-top: 15px; font-weight: bold; letter-spacing: 1px;}

        @keyframes floating { 0% { transform: translateY(0); } 50% { transform: translateY(-15px); box-shadow: 0 0 45px rgba(212, 175, 55, 0.8), inset 0 0 20px #000; } 100% { transform: translateY(0); } }

        .btn-start {
            background: linear-gradient(to right, #d4af37, #b8860b); border: 3px solid #fff;
            padding: 18px 50px; font-size: 1.5rem; border-radius: 50px; color: #000; cursor: pointer;
            font-weight: 900; box-shadow: 0 0 20px rgba(212, 175, 55, 0.5); transition: all 0.3s;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .btn-start:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(212, 175, 55, 0.8); }

        .layout-container { display: none; width: 100%; max-width: 1200px; padding: 15px; box-sizing: border-box; position: relative; z-index: 10; gap: 30px; }
        
        .game-main { flex: 1; display:flex; flex-direction:column; }
        .ladder-aside {
            width: 340px; display: flex; flex-direction: column-reverse;
            background: #01031c; border-left: 3px solid #d4af37; padding: 20px 15px; box-shadow: -10px 0 20px rgba(0,0,0,0.8);
            border-radius: 0 20px 20px 0;
        }

        .ladder-item {
            padding: 10px 15px; margin: 4px 0; color: #d4af37; font-size: 1.2rem; display: flex; justify-content: space-between; 
            font-weight: bold; border: 2px solid transparent; transition: all 0.2s; position: relative;
        }
        .ladder-item span.q-num { color: #d4af37; width: 35px; text-align: right; margin-right: 15px; }
        .ladder-item span.q-reward { flex: 1; text-align: left; }
        
        .ladder-item.active { 
            background: linear-gradient(to right, #d47e00 0%, #ffaa00 50%, #d47e00 100%); 
            color: #000 !important; border-color: #fff; border-radius: 40px; transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.6);
        }
        .ladder-item.active span.q-num, .ladder-item.active span.q-reward { color: #000; font-weight: 900;}
        
        .ladder-item.won { color: #00ff88; }
        .ladder-item.won span.q-num { color: #00ff88; }

        .current-reward-mobile { 
            display: none; text-align: center; margin: 0 auto 25px auto; font-size: 1.15rem; font-weight: 500; 
            color: #fff; background: linear-gradient(to bottom, #001233 40%, #00081c); 
            padding: 12px 20px; border-radius: 30px; border: 2px solid #fff; max-width: 90%;
            box-shadow: 0 0 10px rgba(255,255,255,0.1), inset 0 0 20px rgba(0, 50, 150, 0.4);
        }
        .current-reward-mobile .reward-label { color: #d4af37; font-weight: bold; margin-right: 5px;}

        .timer-wrapper { display: flex; justify-content: center; margin-bottom: 30px; }
        .timer { width: 90px; height: 90px; border-radius: 50%; border: 4px solid #d4af37; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; color: #d4af37; background: radial-gradient(circle, #012a63, #000); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4), inset 0 0 15px rgba(0,0,0,0.8); transition: all 0.3s; }
        .timer.danger { color: #ff3c3c; border-color: #ff3c3c; box-shadow: 0 0 20px rgba(255, 60, 60, 0.5), inset 0 0 15px rgba(0,0,0,0.8); animation: pulse-danger 0.5s infinite alternate; }
        @keyframes pulse-danger { from { transform: scale(1); } to { transform: scale(1.1); } }

        .question-box { background: linear-gradient(to bottom, #001233 40%, #00081c); border: 2px solid #fff; border-radius: 40px; padding: 25px 30px; text-align: center; font-size: 1.25rem; line-height: 1.4; box-shadow: 0 0 15px rgba(255,255,255,0.2), inset 0 0 30px rgba(0, 50, 150, 0.5); min-height: 90px; display: flex; align-items: center; justify-content: center; margin-bottom: 30px; font-weight: 500; position:relative;}
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px 25px; width: 100%; position:relative; }
        .option { background: linear-gradient(to bottom, #001233 40%, #00081c); border: 2px solid #fff; border-radius: 30px; padding: 12px 20px; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; transition: all 0.3s; box-shadow: 0 0 10px rgba(255,255,255,0.1), inset 0 0 20px rgba(0, 50, 150, 0.4); word-break: break-word; position:relative;}
        @media (hover: hover) and (pointer: fine) {
            .option:hover { background: linear-gradient(to bottom, #8f6e1f, #5a440a); border-color: #d4af37; }
        }
        .option.selected { background: linear-gradient(to bottom, #d47e00, #965900); border-color: #fff; color: #fff; animation: flash 0.2s infinite alternate; }
        .option.correct { background: linear-gradient(to bottom, #008f4b, #00562d); border-color: #fff; color: #fff; box-shadow: 0 0 20px rgba(0, 143, 75, 0.6); }
        .option.wrong { background: linear-gradient(to bottom, #b30000, #660000); border-color: #fff; color: #fff; }
        .letter { color: #d4af37; font-weight: bold; margin-right: 15px; font-size: 1.2rem; min-width: 25px; }
        .option.selected .letter, .option.wrong .letter { color: #fff; }
        .option.correct .letter { color: #d4af37; }

        @media (min-width: 900px) {
            .layout-container { flex-direction: row; }
            .question-box::before, .question-box::after, .option::before, .option::after { content: ''; position: absolute; top: 50%; width: 150vw; height: 2px; background: linear-gradient(to right, transparent, #fff 10%, #fff 90%, transparent); z-index: -1; opacity: 0.7; }
            .question-box::before { right: calc(100% - 20px); width: 50vw; } .question-box::after { left: calc(100% - 20px); width: 50vw; }
            .option:nth-child(odd)::before { right: calc(100% - 20px); width: 50vw; } .option:nth-child(odd)::after { left: calc(100% + 20px); width: 40px; }
            .option:nth-child(even)::before { right: calc(100% + 20px); width: 40px; } .option:nth-child(even)::after { left: calc(100% - 20px); width: 50vw; }
        }

        @media (max-width: 899px) {
            .layout-container { flex-direction: column; }
            .ladder-aside { display: none; } /* Hide full ladder on mobile, show current text */
            .current-reward-mobile { display: block; }
            .options-grid { grid-template-columns: 1fr; gap: 12px; }
            .question-box { font-size: 1rem; padding: 15px 20px; border-radius: 25px; margin-bottom: 20px; }
            .option { font-size: 0.95rem; padding: 12px 15px; border-radius: 20px; }
            .timer { width: 70px; height: 70px; font-size: 1.8rem; border-width: 3px; }
            .logo-circle { width: 230px; height: 230px; border-width: 5px; }
            .logo-text { font-size: 1.5rem; }
            .btn-start { padding: 15px 30px; font-size: 1.1rem; }
        }

        .game-over { text-align: center; }
        .game-over h1 { color: #d4af37; font-size: 3rem; margin-bottom: 10px; text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);}
        .game-over p { font-size: 1.3rem; margin-bottom: 10px; line-height: 1.5; }
        .final-reward-pill {
            display: inline-block; padding: 15px 40px; font-size: 2rem; font-weight: 900; 
            color: #000; background: linear-gradient(to right, #d47e00 0%, #ffcf54 50%, #d47e00 100%);
            border-radius: 50px; border: 4px solid #fff; margin-top: 5px; margin-bottom: 35px;
            box-shadow: 0 0 40px rgba(255, 170, 0, 0.8), inset 0 0 10px rgba(255,255,255,0.8); 
            font-family: system-ui, -apple-system, sans-serif; text-transform: uppercase;
        }
        .question-number-display {
            text-align: center; color: #d4af37; font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="ambient-light light-1"></div>
        <div class="ambient-light light-2"></div>

        <div class="start-screen" id="start-screen">
            <div class="logo-circle">
                <span class="logo-text">KİM <br> GERÇEKLERİ BİLMEK</span>
                <span class="logo-sub">İSTER?</span>
            </div>
            <button class="btn-start" onclick="startApp()">YARIŞMAYA BAŞLA</button>
        </div>

        <div class="layout-container" id="app-container">
            <div class="game-main">
                <div class="current-reward-mobile" id="mobile-reward"><span class="reward-label">Ödül :</span> Adet döngüsü premium app üyeliği</div>
                <div class="timer-wrapper">
                    <div class="timer" id="timer">31</div>
                </div>
                <div class="question-number-display" id="q-number-display">1. Soru</div>
                <div style="position:relative; width:100%;">
                    <div class="question-box" id="question"></div>
                    <div class="options-grid" id="options"></div>
                </div>
            </div>
            <div class="ladder-aside" id="ladder">
                <!-- Javascript will inject ladder items -->
            </div>
        </div>
    </div>

    <!-- Web Audio API Sound Synthesizer is completely standalone, doesn't depend on external MP3 servers! -->
    <script>
        const rewards = [
            "Adet döngüsü premium app üyeliği",
            "Titreşimli dildo seti",
            "Fantezi Kelepçesi",
            "Deri kırbaç",
            "Jartiyer Seti",
            "Dev dildo (50 Cm Titreşimli)",
            "Seks Robotu (Erkek)"
        ];

        const questions = [
            {
                q: "Aşağıdakilerden hangi yetişkin film karakterinin göğüslerinin büyük olduğu mavi gözlerinden anlaşılır?",
                opts: { A: "Gülizar", B: "Alexander Dadario", C: "Sibel Kekili", D: "Mia Khalifa" },
                ans: "A"
            },
            {
                q: "Büyük oğlu örümcek adam olduğunu iddia eden bir kadının kocası kimdir?",
                opts: { A: "Tobby Magiuere", B: "Şenol Güneş", C: "Bengin", D: "Herhangi bir adam olabilir" },
                ans: "D"
            },
            {
                q: "Dayısı ile annesini ensestte yakalayan biri aşağıdaki bahanelerden hangisini uydurmuştur ?",
                opts: { A: "Perdeleri takıyordu", B: "Bayram Ziyaretine Gelmişti / Atletle ?", C: "Annem dayıma zaten daha önce vermişti", D: "Bulaşık makinesi bozulmuştu" },
                ans: "C"
            },
            {
                q: "Evli olmasına rağmen kocası hapisteyken gebe kalan bir kadın nasıl gebe kalmıştır?",
                opts: { A: "Bluetooth bağlantısı ile", B: "Annem biraz oynaktır", C: "Uzaktan Eğitim ile", D: "Leylekler getirdi / Şüpheli" },
                ans: "B"
            },
            {
                q: "Türkiye'de Türk lirasının değersizleşmesiyle hayat kadını olan Cizreli hayat kadını nereye göç etmiştir?",
                opts: { A: "Hollanda", B: "Brezilya", C: "Rusya", D: "Almanya" },
                ans: "D"
            },
            {
                q: "Cizrede yapılan bir f*huş baskınında patroniçe hangi mahallede yakalanmıştır?",
                opts: { A: "Cudi Mahallesi", B: "Nur Mahallesi", C: "Şah Mahallesi", D: "Sur Mahallesi" },
                ans: "A"
            },
            {
                q: "Aşağıdakilerden hangisi babanızdır?",
                opts: { A: "Bengin", B: "Mehdi-Devran-Emir-Kadri-Pırtekol-Soner", C: "Ayhan Hoca", D: "Hepsi" },
                ans: "D"
            }
        ];

        let currentQIndex = 0;
        let timeLeft = 31;
        let timerInterval;
        let isAnswered = false;

        const startScreen = document.getElementById('start-screen');
        const appContainer = document.getElementById('app-container');
        const ladderContainer = document.getElementById('ladder');
        const mobileReward = document.getElementById('mobile-reward');
        
        // ---- WEB AUDIO API SOUND MANAGER ----
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const SoundManager = {
            tickTock: false,
            playTick: function() {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                this.tickTock = !this.tickTock;
                
                const bufferSize = audioCtx.sampleRate * 0.05;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
                
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = this.tickTock ? 4000 : 2500;
                filter.Q.value = 5.0; // Metallic resonance
                
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(1.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
                
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start(audioCtx.currentTime);
            },
            playTense: function() {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(80, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.4);
            },
            startTenseLoop: function() {
                this.stopTenseLoop();
                this.playTense();
                this.tenseInterval = setInterval(() => this.playTense(), 800);
            },
            stopTenseLoop: function() {
                if(this.tenseInterval) clearInterval(this.tenseInterval);
            },
            playCorrect: function() {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const freqs = [392.00, 523.25, 659.25, 783.99];
                freqs.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0, audioCtx.currentTime + index * 0.1);
                    gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + index * 0.1 + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.1 + 0.6);
                    osc.start(audioCtx.currentTime + index * 0.1);
                    osc.stop(audioCtx.currentTime + index * 0.1 + 0.6);
                });
            },
            playWrong: function() {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const freqs = [300, 250, 200, 150];
                freqs.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.15);
                    osc.frequency.exponentialRampToValueAtTime(freq * 0.8, audioCtx.currentTime + index * 0.15 + 0.15);
                    gain.gain.setValueAtTime(0, audioCtx.currentTime + index * 0.15);
                    gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + index * 0.15 + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.15 + 0.3);
                    osc.start(audioCtx.currentTime + index * 0.15);
                    osc.stop(audioCtx.currentTime + index * 0.15 + 0.3);
                });
            }
        };

        function startApp() {
            try {
                if(audioCtx.state === 'suspended') audioCtx.resume();
            } catch(e) {}
            
            setTimeout(() => {
                startScreen.style.display = 'none';
                appContainer.style.display = 'flex';
                initQuiz();
            }, 50);
        }

        function initQuiz() {
            currentQIndex = 0;
            renderLadder();
            loadQuestion();
        }

        function renderLadder() {
            ladderContainer.innerHTML = '';
            rewards.forEach((rew, idx) => {
                const el = document.createElement('div');
                el.className = 'ladder-item';
                el.id = 'ladder-' + idx;
                el.innerHTML = `<span class="q-num">${idx + 1}</span> <span class="q-reward">♦ ${rew}</span>`;
                ladderContainer.appendChild(el);
            });
            updateLadderUI();
        }

        function updateLadderUI() {
            rewards.forEach((rew, idx) => {
                const el = document.getElementById('ladder-' + idx);
                el.className = 'ladder-item';
                if (idx < currentQIndex) el.classList.add('won');
                else if (idx === currentQIndex) el.classList.add('active');
            });

            if(currentQIndex < rewards.length) {
                mobileReward.innerHTML = `<span class="reward-label">Ödül :</span> ${rewards[currentQIndex]}`;
            }
        }

        function loadQuestion() {
            if (currentQIndex >= questions.length) {
                showGameOver(true);
                return;
            }
            
            updateLadderUI();
            
            document.getElementById('q-number-display').innerText = `${currentQIndex + 1}. SORU`;
            
            isAnswered = false;
            timeLeft = 31;
            updateTimerDisplay();

            const q = questions[currentQIndex];
            const qEl = document.getElementById('question');
            
            qEl.style.opacity = 0;
            qEl.innerText = q.q;
            setTimeout(() => { qEl.style.transition = 'opacity 0.5s'; qEl.style.opacity = 1; }, 100);
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            const keys = ['A', 'B', 'C', 'D'];
            keys.forEach((key, index) => {
                const optText = q.opts[key];
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.style.opacity = 0;
                btn.style.transform = 'translateY(10px)';
                btn.innerHTML = `<span class="letter">${key}:</span> <span class="text">${optText}</span>`;
                btn.onclick = () => selectOption(key, btn);
                optionsContainer.appendChild(btn);
                
                setTimeout(() => { 
                    btn.style.transition = 'all 0.5s'; 
                    btn.style.opacity = 1; 
                    btn.style.transform = 'translateY(0)';
                }, 200 + (index * 150));
            });

            setTimeout(() => {
                startTimer();
            }, 800);
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                SoundManager.playTick();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timeUp();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const timerEl = document.getElementById('timer');
            if (timerEl) {
                timerEl.innerText = timeLeft;
                if (timeLeft <= 10) timerEl.classList.add('danger');
                else timerEl.classList.remove('danger');
            }
        }

        function selectOption(key, btn) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(timerInterval);
            btn.classList.add('selected');
            SoundManager.startTenseLoop();
            
            setTimeout(() => {
                btn.classList.remove('selected');
                revealAnswer(key, btn);
            }, 2500); 
        }

        function timeUp() {
            if (isAnswered) return;
            isAnswered = true;
            revealAnswer(null, null);
        }

        function revealAnswer(selectedKey, selectedBtn) {
            SoundManager.stopTenseLoop();

            const q = questions[currentQIndex];
            const allBtnNodes = document.querySelectorAll('.option');
            let isCorrect = selectedKey === q.ans;

            if (isCorrect) {
                selectedBtn.classList.add('correct');
                SoundManager.playCorrect();
            } else {
                if (selectedBtn) selectedBtn.classList.add('wrong');
                SoundManager.playWrong();
                allBtnNodes.forEach(b => {
                    const bKey = b.querySelector('.letter').innerText[0];
                    if (bKey === q.ans) b.classList.add('correct');
                });
            }
            
            setTimeout(() => {
                if (isCorrect) {
                    currentQIndex++;
                    loadQuestion();
                } else {
                    showGameOver(false);
                }
            }, 3000);
        }

        function showGameOver(isWin) {
            let rewardWon = "Hiçbir Şey (Kaybettin)";
            if(isWin) {
                rewardWon = rewards[rewards.length - 1]; // All questions correct
            } else if (currentQIndex > 0) {
                rewardWon = rewards[currentQIndex - 1]; // Last correct answer's reward
            }

            appContainer.innerHTML = `
                <div class="game-over" style="width: 100%;">
                    <h1>${isWin ? 'TEBRİKLER!' : 'OYUN BİTTİ!'}</h1>
                    <p style="font-size: 1.5rem; margin-bottom: 5px;">${!isWin ? `<span style="color:#ff3c3c; font-weight:bold; text-shadow: 0 0 10px #ff3c3c;">${currentQIndex + 1}. Soruda Elendiniz!</span><br><br>` : ''} ${isWin ? 'Tüm soruları bilerek harika bir performans sergilediniz.' : 'Yanlış cevap verdiniz veya süreniz bitti.'}</p>
                    <p style="font-size:1.2rem; color:#aaa; margin-top:20px;">KAZANDIĞINIZ ÖDÜL:</p>
                    <div class="final-reward-pill">${rewardWon}</div>
                    <br>
                    <button class="btn-start" style="padding: 12px 30px; font-size: 1.2rem;" onclick="location.reload()">YENİDEN BAŞLA</button>
                </div>
            `;

            // Fire confetti
            setTimeout(() => {
                if (typeof confetti === 'function') {
                    if (isWin) {
                        confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
                        setTimeout(() => confetti({ particleCount: 150, spread: 120, origin: { y: 0.6 } }), 500);
                    } else {
                        confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 }, colors: ['#d4af37', '#ffffff'] });
                    }
                }
            }, 300);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</body>
</html>
